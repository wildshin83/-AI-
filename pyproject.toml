[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bom-management-service"
version = "0.1.0"
description = "로컬 설치형 BOM·ERP·견적 검토 서비스"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "openpyxl>=3.1,<4",
    "python-multipart>=0.0.9,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.0,<9",
    "ruff>=0.6,<1",
]
package = [
    "pyinstaller>=6.0,<7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
