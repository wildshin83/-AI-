{% extends "base.html" %}
{% block title %}로그인 | BOM 관리 서비스{% endblock %}
{% block content %}
<section class="auth-card card">
  <p class="eyebrow">BOM 관리 서비스</p>
  <h1>로그인</h1>
  <p>관리자가 등록한 계정으로 로그인하세요.</p>
  {% if error %}<p class="error-message" role="alert">{{ error }}</p>{% endif %}
  <form class="form-grid single-column" method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label>이메일<input type="email" name="email" autocomplete="username" required maxlength="254"></label>
    <label>비밀번호<input type="password" name="password" autocomplete="current-password" required maxlength="256"></label>
    <div class="form-actions"><button class="button primary" type="submit">로그인</button></div>
  </form>
</section>
{% endblock %}
